[WMS]
INFO=P1

[Network]
LocalPort=8401
#RemoteIP=192.168.51.220
RemoteIP=127.0.0.1
RemotePort=8400

[Property]
SEND_WINDOW=4
STATUS_SEND_LOG=0
RE_DRCT_CNT=3
; P-BOX 입고 요구(L) 전문에 미실행 유무를 붙일지.
;   1 = 원본 형식.  L 작업번호#1(4) 미실행#1(1) 작업번호#2(4) 미실행#2(1)  = 11자
;   0 = 문서 IV.9.  L 작업번호#1(4) 작업번호#2(4)                          =  9자
; 현장에서 도는 ECS 가 11자를 보내므로 기본값은 1 이다.
BOX_STO_REQ_FLAG=1
; 입고 / 이동 / 랙투랙 완료 보고(F)의 완료차수.
;   0 = 완료차수 1 (기본. 현장 WMS 가 지금까지 받아 온 값)
;   1 = 완료차수 2 (기존 ECS 와 같음)
; 출고는 이 값과 상관없이 크레인 완료 1, 도착 2 로 나간다. 바꾸면 HOST 태스크를 다시 켠다.
COMPLETE_STEP_FINAL=0


[DB]
IP=127.0.0.1
#IP=10.99.43.252
#IP=10.117.3.174
DATABASE=KET_WCS
PORT=5432
USER=KET_WCS
USER_PW=KET_WCS
; 창고 타입. 다른 태스크(WCS_DB.INI)와 같은 값이어야 한다. DB 안에서만 쓰는 값이다.
WH_TYP=10
; 전문에 실리는 창고구분(WareHouse Define). A:PalletRack, B:P-BoxRack
; 위의 WH_TYP 과는 다른 항목이다.
WH_DEF=A
LOGPATH=.\bin\Debug\ECSCOMALog
FILENAME=IOTASK_

; SIM MODE(상위 없이 혼자 작업을 이어 붙이는 시험 모드)에서 쓰는 랙 범위.
; 예전에는 CELL_MST 에서 읽었는데 이 현장은 재고관리를 쓰지 않아 여기로 뺐다.
; 시험용 값이라 실제 재고와 맞출 필요는 없다.
[SIM]
MIN_BANK=1
MAX_BANK=8
MAX_BAY=17
MAX_LEVEL=15

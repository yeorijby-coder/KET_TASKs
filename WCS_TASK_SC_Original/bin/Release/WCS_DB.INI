[DB_TYPE]
--0:None, 1:Oracle, 2:PostgreSql, 3:MS_SQL, 4:MY_SQL
TYPE = 2

[DB_1] --Oracle
PROVIDER=OraOLEDB.Oracle.1
ALIAS=ORCL
USERID=WCS
PASSWORD=WCS

[DB_2] --PostgreSql
IP=localhost
DATABASE = KET_WCS
PORT = 5432
USER = KET_WCS
USER_PW = KET_WCS


[PROCESS]
CNT=11

[CNF]
WH_TYP=10
USERID=M-MELQSC

--SINGLE / TWIN 을 한 앱으로 합병한 통합 구성.
--원본 EcsDef.h 의 SC_CNT=11 및 DB sc_data(SC 901~911 / PLC 01~11) 에 맞춰

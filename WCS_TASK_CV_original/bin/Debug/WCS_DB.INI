[DB_1] --Oracle
PROVIDER=OraOLEDB.Oracle.1
ALIAS=XE
USERID=BSWCS
PASSWORD=BSWCS

[DB_2] --PostgreSql
IP=localhost
DATABASE = KET_WCS
PORT = 5432
USER = KET_WCS
USER_PW = KET_WCS

[COM_SETTING]
--Setting=1 은 COMM0 을 복제해 CNT개를 만드는 기능이라
--PLC 별로 값이 다른 이 통합 INI 에서는 반드시 0 으로 둘 것
Setting=0

[PROCESS]
--1F/3F/BOX 통합 : PLC 01~08 전체를 한 앱이 담당한다
CNT=8

[CNF]
WH_TYP=10
USERID=M-MELQCV

[DELAY]
SND=5
RCV=5


[SCH]
--층별 스케줄러 스레드 사용여부 (Y=기동, N=기동안함. 키가 없으면 Y)
USE_1F  = Y
USE_3F  = Y
USE_BOX = Y

--도착하면 트랙 작업번호를 0 으로 지우는 작업대 (원본 ECS IsDeleteDataStation = 207,251). 키 없으면 207,251. 비우면 안 지움.
DELETE_DATA_STN=207,251
--DELETE_DATA_STN=
--준비 신호(입고 준비 D250.1 / 출고 준비 D251.0) 없이 센서ON + 작업번호 0 만으로 출발 지시를 쓰는 작업대. 비우면 적용 안 함(현장 기본). P-BOX 피킹대 251.
--START_NO_READY_STN=251

--유량(1F)/매거진(3F)/이음새 탭을 한 옵션으로 묶어 분리한다. Y=분리(기본), N=세 탭 모두 없애고 기존대로(이음새 로그도 각 층 탭에 남김)
SPLIT_TABS=Y
--"1층 출고 : 결정대가 비어야 대기대에서 출발" 체크박스를 화면에 보인다. Y=보임, N=숨김(기본). 숨겨도 체크 값은 그대로 적용된다
SHOW_RET_DECIDE_WAIT=N
--화면 오른쪽 버전 날짜(2021.01.30)를 보인다. Y=보임, N=숨김(기본)
SHOW_VERSION_DATE=N

[SC]
; Crane store/retrieve alternation like old ECS (2026-11-22). Y = on (default). GRACE = ms the non-turn side waits per step.
DISPATCH_ALT=Y
DISPATCH_GRACE_MS=100
DISPATCH_LOG=Y
RET_SKIP_HS=Y
AUTO_RESET=Y
AUTO_ACTIVE=Y
; On crane completion send fork-data delete (DELFK) to the crane? N = no (default, same as old ECS: PLC keeps the last job number, next order overwrites it). Y = old behavior.
DELFK_ON_COMPLETE=N
[1F_RET]
EXCLUDE_204=Y

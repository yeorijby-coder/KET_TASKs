--"1층 출고 : 결정대가 비어야 대기대에서 출발" 체크박스를 화면에 보일지. Y=보임, N=숨김(기본). 숨겨도 체크 값은 그대로 적용된다
SHOW_RET_DECIDE_WAIT=N
--화면 위쪽의 버전 날짜 글자(2021.01.30)를 보일지. Y=보임, N=숨김(기본)
SHOW_VERSION_DATE=N
--도착하면 트랙 작업번호를 0 으로 지우는 작업대 (원본 ECS IsDeleteDataStation = 207,251). 키 없으면 207,251. 비우면 안 지움.
DELETE_DATA_STN=207,251
--준비 신호(입고 준비 D250.1 / 출고 준비 D251.0) 없이 센서ON + 작업번호 0 만으로 출발 지시를 쓰는 작업대. 비우면 적용 안 함(현장 기본). P-BOX 피킹대 251.
--START_NO_READY_STN=251
--층별 스케줄러 스레드 사용여부 (Y=기동, N=기동안함. 키가 없으면 Y)
USE_1F  = Y
USE_3F  = Y
USE_BOX = Y

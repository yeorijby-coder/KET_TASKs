[WMS]
INFO=P1

[Network]
LocalPort=8401
RemoteIP=127.0.0.1
RemotePort=8400

[Property]
RE_DRCT_CNT=3
; P-BOX 입고 요구(L) 전문에 미실행 유무를 붙일지.
;   1 = 원본 형식.  L 작업번호#1(4) 미실행#1(1) 작업번호#2(4) 미실행#2(1)  = 11자
;   0 = 문서 IV.9.  L 작업번호#1(4) 작업번호#2(4)                          =  9자
; 현장에서 도는 ECS 가 11자를 보내므로 기본값은 1 이다.
BOX_STO_REQ_FLAG=1

[DB]
IP=127.0.0.1
DATABASE=KET_WCS
PORT=5432
USER=KET_WCS
USER_PW=KET_WCS
; 창고 타입. 다른 태스크(WCS_DB.INI)와 같은 값이어야 한다. DB 안에서만 쓰는 값이다.
WH_TYP=10
; 전문에 실리는 창고구분(WareHouse Define). A:PalletRack, B:P-BoxRack
; 위의 WH_TYP 과는 다른 항목이다.
WH_DEF=A
LOGPATH=.\ECSCOMALog
FILENAME=IOTASK_

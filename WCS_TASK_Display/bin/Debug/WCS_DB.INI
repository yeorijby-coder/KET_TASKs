[DB_TYPE]
--0:None, 1:Oracle, 2:PostgreSql, 3:MS_SQL, 4:MY_SQL
TYPE=2

[DB_1] --Oracle
PROVIDER=OraOLEDB.Oracle.1
ALIAS=XE
USERID=BSWCS
PASSWORD=BSWCS

[DB_2] --PostgreSql
IP=localhost
DATABASE=KET_WCS
PORT=5432
USER=KET_WCS
USER_PW=KET_WCS

[PROCESS]
--Number of display controllers (one [COMM*] section each)
CNT=1

[CNF]
WH_TYP=10
USERID=M-DISPLAY

[COMM0]
EQMT=DISPLAY
--Display board IP / port (legacy Ecs.ini [Display1] Address/Port)
--IP=192.168.10.24
IP=127.0.0.1
CUR_PORT=8001
FROM_PORT=8001
TO_PORT=8009
PORT_CNT=1
--CNT = number of physical displays on this controller (legacy DSP_CNT)
CNT=2
PLC_NO=01
--Legacy track mapping (Display#1->Track 2006, Display#2->Track 2012)
FR_TRACK=2006
TO_TRACK=2012
LOG_PATH=C:\WCS_TASK\DISPLAY
FILENAME=WCS_TASK_DISPLAY_COMM0

[DELAY]
SND=500
RCV=500
